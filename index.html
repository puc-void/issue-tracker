<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- Tailwind + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body class="bg-base-200 min-h-screen">

    <section class="max-w-6xl mx-auto p-6">


        <section id="title-section" class="mb-6">

            <h1 class="text-3xl font-bold">
                Job Application Tracker
            </h1>

        </section>


        <section id="stats-section" class="mb-8">

            <div class="grid md:grid-cols-3 gap-4">

                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body py-5">
                        <p class="text-sm text-gray-500">Total</p>
                        <h2 id="total-count" class="text-3xl font-bold">8</h2>
                    </div>
                </div>

                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body py-5">
                        <p class="text-sm text-gray-500">Interview</p>
                        <h2 id="interview-count" class="text-3xl font-bold text-success">0</h2>
                    </div>
                </div>

                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body py-5">
                        <p class="text-sm text-gray-500">Rejected</p>
                        <h2 id="rejected-count" class="text-3xl font-bold text-error">0</h2>
                    </div>
                </div>

            </div>

        </section>

    </section>

</body>

</html>
